name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      py_tag:
        description: "Python base tag (e.g. 3.12-slim, 3.13-slim, 3.14-slim)"
        required: true
        default: "3.12-slim"
      ta_lib_version:
        description: "TA-Lib release tag (no leading v)"
        required: true
        default: "0.6.3"
      rev:
        description: "Force a specific rev number (else auto-bump)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      rev: ${{ steps.meta.outputs.rev }}
      py: ${{ steps.meta.outputs.py }}
      talib: ${{ steps.meta.outputs.talib }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          PY_TAG="${{ github.event.inputs.py_tag || '3.12-slim' }}"
          TA_LIB_VER="${{ github.event.inputs.ta_lib_version || '0.6.3' }}"
          REV_FILE="slim/VERSIONS"
          [[ -f "$REV_FILE" ]] || echo "0" > "$REV_FILE"
          FORCED="${{ github.event.inputs.rev }}"
          if [[ -n "$FORCED" ]]; then
            REV="$FORCED"
          else
            REV=$(( $(cat "$REV_FILE") + 1 ))
          fi
          echo "tag=${PY_TAG}-talib${TA_LIB_VER}-r${REV}" >> "$GITHUB_OUTPUT"
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
          echo "py=${PY_TAG}" >> "$GITHUB_OUTPUT"
          echo "talib=${TA_LIB_VER}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_norm: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_norm: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-arch to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: slim/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            PYTHON_TAG=${{ needs.meta.outputs.py }}
            TA_LIB_VERSION=${{ needs.meta.outputs.talib }}
            CREATED_AT=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }}-${{ matrix.platform_norm }}

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construct multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/python-talib-slim:slim-talib${{ needs.meta.outputs.talib }}-py${{ needs.meta.outputs.py }} \
            -t ghcr.io/${{ github.repository_owner }}/python-talib-slim:stable \
            \
            ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }}-linux-arm64

      - name: Mirror multi-arch manifest to Docker Hub
        if: env.DH_USERNAME != ''
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DH_PASSWORD" | docker login -u "$DH_USERNAME" --password-stdin
          docker buildx imagetools create \
            -t danazkari/python-talib-slim:${{ needs.meta.outputs.tag }} \
            -t danazkari/python-talib-slim:stable \
            \
            ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/python-talib-slim:${{ needs.meta.outputs.tag }}-linux-arm64

  bump:
    needs: [meta, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump slim/VERSIONS
        run: |
          echo "${{ needs.meta.outputs.rev }}" > slim/VERSIONS
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add slim/VERSIONS
          git diff --staged --quiet || git commit -m "release: bump slim base rev to r${{ needs.meta.outputs.rev }}"
          git push
